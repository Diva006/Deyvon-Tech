services:
  - type: web
    name: deyvon-tech
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        value: deyvontech@gmail.com
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_TO
        value: deyvontech@gmail.com
      - key: INQUIRY_FILE
        value: /var/data/inquiries.jsonl
    disk:
      name: inquiry-data
      mountPath: /var/data
      sizeGB: 1
